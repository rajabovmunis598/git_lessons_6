<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawllet</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="hero">

  <nav class="nav">
    <div class="nav__logo">
      <span class="nav__logo-icon">L</span>
      <span class="nav__logo-text">lawllet</span>
    </div>
    <div class="nav__links">
      <a href="#" class="nav__link">CONTACT</a>
      <a href="#" class="nav__link">TESTIMONIALS</a>
      <a href="#" class="nav__link">ABOUT</a>
      <a href="#" class="nav__link">TERMS</a>
    </div>
    <button class="nav__search">&#128269;</button>
  </nav>

  <div class="hero__content">

    <div class="hero__left">

      <div class="hero__badge">
        <span class="hero__badge-new">New</span>
        <span class="hero__badge-text">Stay connected to the upcoming & Recent jobs</span>
      </div>

      <h1 class="hero__title">Your Solution Legal Consultacy</h1>

      <p class="hero__sub">We are here to help you take care of your legality with the best service especially for you.</p>

      <button class="hero__btn">GET STARTED</button>

      <div class="hero__trusted">
        <p class="hero__trusted-text">Trusted by 10+ companies in indonesia</p>
        <div class="hero__logos">
          <img src="./Airbnb Logo.svg" alt="Airbnb" class="hero__logo">
          <img src="./Layer 2.svg" alt="HubSpot" class="hero__logo">
          <img src="./Microsoft Logo.svg" alt="Microsoft" class="hero__logo">
          <img src="./Google Logo.svg" alt="Google" class="hero__logo">
        </div>
      </div>

    </div>

    <div class="hero__right">
      <div class="hero__circle"></div>
      <img src="./creating-a-brand-2mMhaoBGjCs-unsplash-removebg-preview 1.svg" alt="Lawyer" class="hero__person">
      <div class="hero__card">
        <p class="hero__card-name">Tiara Andini</p>
        <p class="hero__card-role">-Lawyer</p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
